<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Split-flap remote</title>
<link rel="icon" href="data:," />
<style>
  :root { --bg: #0b0b0b; --panel: #151515; --line: #2a2a2a; --ink: #f2f2ee; --dim: #8a8a85; --go: #2f9e44; --bad: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 16px; display: flex; align-items: center; gap: 10px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  #dot.on { background: var(--go); }
  label { display: block; font-size: 13px; color: var(--dim); margin: 14px 0 6px; }
  input, textarea, select { width: 100%; font: 16px ui-monospace, Menlo, Consolas, monospace; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  textarea { min-height: 150px; resize: vertical; text-transform: uppercase; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid #5b8def; outline-offset: 1px; }
  .row { display: flex; gap: 10px; align-items: end; }
  .row > * { flex: 1; }
  button { min-height: 44px; font: 600 16px system-ui; border: 0; border-radius: 8px; padding: 0 18px;
    background: #2a2a2a; color: var(--ink); cursor: pointer; }
  button.go { background: var(--go); }
  button:disabled { opacity: .5; }
  .msg { min-height: 1.5em; font-size: 14px; color: var(--dim); margin-top: 8px; }
  .msg.bad { color: var(--bad); }
  #preview { display: grid; gap: 2px; margin-top: 16px; padding: 6px; background: #000; border-radius: 6px; }
  #preview span { aspect-ratio: 2 / 3; background: #1b1b1b; border-radius: 2px; display: grid; place-items: center;
    font: 600 clamp(7px, 2.6vw, 14px) ui-monospace, monospace; }
  .tiles { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tiles button { min-height: 36px; padding: 0 10px; font-size: 18px; }
  #editor[hidden], #pair[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1><span id="dot"></span> Split-flap remote <span id="which" style="color:var(--dim);font-weight:400"></span></h1>

  <form id="pair">
    <label for="code">Board code (shown at the bottom of the board)</label>
    <div class="row">
      <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" />
      <button class="go" style="flex:none">Connect</button>
    </div>
    <div id="pair-msg" class="msg"></div>
  </form>

  <section id="editor" hidden>
    <label for="text">Message — one line per row; long lines wrap at words</label>
    <textarea id="text" spellcheck="false"></textarea>
    <div class="tiles" id="tiles"></div>
    <div id="preview" aria-label="Preview of the board"></div>
    <div id="count" class="msg"></div>

    <div class="row" style="margin-top:12px">
      <div><label for="align">Alignment</label>
        <select id="align"><option value="left">Left</option><option value="center">Centered</option></select></div>
      <div><label for="cols">Columns</label><input id="cols" type="number" min="4" max="40" /></div>
      <div><label for="rows">Rows</label><input id="rows" type="number" min="1" max="12" /></div>
    </div>

    <div class="row" style="margin-top:16px">
      <button id="clear">Clear board</button>
      <button id="send" class="go">Show on board</button>
    </div>
    <div id="send-msg" class="msg"></div>
  </section>
</main>

<script src="layout.js"></script>
<script>
{
  const { COLORS, layout } = window.Flap;
  const $ = (id) => document.getElementById(id);
  const st = { code: "", cols: 22, rows: 6, online: false };
  let ws = null;

  function send(o) {
    if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; }
    return false;
  }

  function connect() {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);
    ws.onopen = () => { $("dot").className = "on"; if (st.code) send({ type: "join", code: st.code }); };
    ws.onclose = () => { $("dot").className = ""; setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.type === "error") { $("pair-msg").textContent = m.message; $("pair-msg").className = "msg bad"; st.code = ""; }
      if (m.type === "joined") {
        st.code = m.code; location.hash = m.code;
        $("pair").hidden = true; $("editor").hidden = false;
        $("which").textContent = "· " + m.code;
        if (m.text && !$("text").value) { $("text").value = m.text; $("align").value = m.align; }
        setOnline(m.online); setSize(m.cols, m.rows);
      }
      if (m.type === "size" || m.type === "board_online") { setSize(m.cols, m.rows); if (m.type === "board_online") setOnline(true); }
      if (m.type === "board_offline") setOnline(false);
      if (m.type === "text") { $("text").value = m.text; $("align").value = m.align; preview(); }
    };
  }

  function setOnline(on) {
    st.online = on;
    $("send-msg").textContent = on ? "" : "The board is offline — messages will show when it reconnects.";
  }
  function setSize(cols, rows) {
    if (cols) st.cols = cols; if (rows) st.rows = rows;
    $("cols").value = st.cols; $("rows").value = st.rows;
    preview();
  }

  function preview() {
    const { grid, overflow } = layout($("text").value, st.cols, st.rows, $("align").value);
    const p = $("preview");
    p.style.gridTemplateColumns = `repeat(${st.cols}, minmax(0, 1fr))`;
    p.innerHTML = grid.map((ch) =>
      COLORS[ch] ? `<span style="background:${COLORS[ch]}"></span>` : `<span>${ch === "<" ? "&lt;" : ch === "&" ? "&amp;" : ch}</span>`).join("");
    $("count").textContent = overflow ? `Too long: only the first ${st.rows} rows will show.` : `${st.cols} × ${st.rows} board`;
    $("count").className = overflow ? "msg bad" : "msg";
  }

  $("pair").addEventListener("submit", (e) => {
    e.preventDefault();
    st.code = $("code").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (st.code.length !== 4) { $("pair-msg").textContent = "The code has 4 characters."; $("pair-msg").className = "msg bad"; return; }
    $("pair-msg").textContent = "Connecting…"; $("pair-msg").className = "msg";
    send({ type: "join", code: st.code });
  });

  function showText(text) {
    const ok = send({ type: "show", text, align: $("align").value });
    $("send-msg").textContent = ok ? (st.online ? "Sent." : "Saved — the board is offline.") : "Not connected to the server.";
  }
  $("send").addEventListener("click", () => showText($("text").value));
  $("clear").addEventListener("click", () => showText(""));
  $("text").addEventListener("input", preview);
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) showText($("text").value); });
  $("align").addEventListener("change", preview);
  for (const id of ["cols", "rows"]) $(id).addEventListener("change", () =>
    send({ type: "config", cols: +$("cols").value, rows: +$("rows").value }));

  $("tiles").innerHTML = Object.keys(COLORS).map((c) => `<button type="button" aria-label="colour tile">${c}</button>`).join("");
  $("tiles").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const ta = $("text"), s = ta.selectionStart;
    ta.setRangeText(b.textContent, s, ta.selectionEnd, "end"); ta.focus(); preview();
  });

  const fromHash = location.hash.slice(1).toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (fromHash.length === 4) { st.code = fromHash; $("code").value = fromHash; }
  connect();
}
</script>
</body>
</html>
